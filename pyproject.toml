[project]
name = "qh_trader"
version = "0.1.0"
description = "Chinese Futures Trading, Backtesting, and Research Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qh_trader"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]
ignore = ["B008"]
