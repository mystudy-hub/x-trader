[project]
name = "qh_trader"
version = "0.1.0"
description = "Chinese Futures Trading, Backtesting, and Research Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.15.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.0.0",
    "tushare>=1.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.optional-dependencies]
# S0-02 / S5-01 选定的 CTP 绑定；Windows x64 与 manylinux x86_64 有预编译 wheel。
# 安装：``uv sync --extra ctp``；未安装时网关明确失败，不静默回退到模拟件。
ctp = [
    "openctp-ctp==6.7.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qh_trader"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 报告 / 入口脚本以人类可读的单行文案为主，允许超长 f-string。
"scripts/report.py" = ["E501"]
"scripts/scan_params.py" = ["E501"]
"scripts/replay_market_data.py" = ["E501"]
