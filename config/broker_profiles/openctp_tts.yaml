simulation_notes:
- openctp 模拟平台为 TTS 系统，以 CTPAPI 兼容接口对外通讯；连接必须使用 TTS 版原生库 (http://www.openctp.cn/download/CTPAPI/TTS/tts_6.7.11.zip，与
  openctp-ctp 6.7.11 同版本)
- 加载官方库的症状：连接上报 4097，或登录返回『不合法的登录』——两者都说明原生库不是 TTS 版
- TTS 不校验终端信息（ReqAuthenticate 直接成功），BrokerID 可留空（本登记填 9999 仅为一致性）
- TTS 支持 ReqQryInstrumentCommissionRate / ReqQryInstrumentMarginRate / ReqQryInvestorPositionDetail，可用于核验本地的手续费与保证金研究假设（SimNow
  的同类查询在休市日返回空）
- 账号须通过 openctp 公众号注册（一个微信号最多 3 个 7x24/仿真号），密码在同一微信号的所有模拟号之间共享；SimNow
  账号与 TTS 账号不通用
- 2026-09-28 柜台实测补充：ReqQryProduct 的 VolumeMultiple / PriceTick 在 TTS 上**恒为 0**（品种级口径不可用），合约参数须用
  ReqQryInstrument（实测 SHFE.rb2610：乘数 10、最小变动 1.0、到期日 20261015，与本地登记一致）；`scripts/ctp_probe.py
  --verify-catalog` 因此会把 10 个本地品种全部报为不一致——这是柜台返回空值，不是本地登记错误
- 费率与保证金口径：TTS 支持 ReqQryInstrumentCommissionRate / ReqQryInstrumentMarginRate（SimNow 在休市日返回空），但本项目的
  查询适配器尚未接入这两个查询，属待交付项
- '2026-09-28 费率 / 保证金实测（scripts/ctp_probe.py --verify-rates）：真实市场合约返回空记录（rb/au/cu/m/c/i/jd/AP/MA/FG 全部 0 条，柜台没给口径），只有柜台自有合约（TEST、lc2610、HO2610-C-2500 等）返回费率；因此这 10 个本地品种的手续费 / 保证金仍没有柜台口径可比，仍是研究假设'
- '2026-09-28 拒单回报实测：柜台拒单（OnErrRtnOrderInsert）的回报不带 TradingDay，本项目原先按缺字段判为转换失败并丢掉柜台错误码；现已改为用该会话已核验的交易日补齐（证据里标 trading_day_source = session），拒单因此能表达为 REJECTED，并把错误码 / 报文写进网关状态的 counter_rejections'
- '2026-09-28 持仓探测实测：做市模式要求高于叫卖价才立即成交，恰好等于卖一价可能挂住不成交（本机实测发生过），因此探测用卖一价加若干跳下单；平仓后柜台会留下 Position=0 但 LongFrozen>0 的持仓行，本项目按既有口径把这类记录保留在证据里并把查询标为不完整'
- '2026-09-28 撤单实测：按原会话三元组的撤单在 TTS 上可用（3 笔活动委托全部撤净）'

