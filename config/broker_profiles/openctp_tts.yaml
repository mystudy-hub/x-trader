simulation_notes:
- openctp 模拟平台为 TTS 系统，以 CTPAPI 兼容接口对外通讯；连接必须使用 TTS 版原生库 (http://www.openctp.cn/download/CTPAPI/TTS/tts_6.7.11.zip，与
  openctp-ctp 6.7.11 同版本)
- 加载官方库的症状：连接上报 4097，或登录返回『不合法的登录』——两者都说明原生库不是 TTS 版
- TTS 不校验终端信息（ReqAuthenticate 直接成功），BrokerID 可留空（本登记填 9999 仅为一致性）
- TTS 支持 ReqQryInstrumentCommissionRate / ReqQryInstrumentMarginRate / ReqQryInvestorPositionDetail，可用于核验本地的手续费与保证金研究假设（SimNow
  的同类查询在休市日返回空）
- 账号须通过 openctp 公众号注册（一个微信号最多 3 个 7x24/仿真号），密码在同一微信号的所有模拟号之间共享
- 本登记的能力项结构沿用 SimNow 登记，全部为未核验；须按目标环境逐项实测后填写
