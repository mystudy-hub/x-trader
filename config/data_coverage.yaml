principles:
- 缺少所选时段或时刻的价格时该执行策略不可运行
- 研究模式不能静默借用其他时段 Open/Close 或插值补造成交价
- 缺少结算价、关键费率或交易时段时，精确核算模式中止并说明缺项
- 明确主连与实际合约的区别，仅有主连数据时结果标注为粗筛
- 日盘开盘、夜盘开盘和固定盘中时刻不能由同一个日线 Open 代替
